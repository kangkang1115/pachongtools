services:
  - type: web
    name: pachong-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DB_TYPE
        value: sqlite
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./videocrawler.db
      - key: DOWNLOAD_DIR
        value: /tmp/downloads
